Research Interests: 'Public engagement in policy making processes, mainly environmental and
  education policy issues. This ranges from how government agencies conduct public outreach
  to how advocacy groups try to influence policy outcomes, and the measurable outcomes of
  these efforts.'
Teaching Interests: 'Public policy processes, civic engagement in public policy, policy
  analysis, program evaluation, environmental policy, and education policy.'
Sustainability Contributions: Prior employment and consultancies with Plan International,
  the International Boundary and Water Commission, US EPA, US Air Force, the Army
  Environmental Policy Institute, Caltrans, SF Public Utilities Commission, Petaluma
  Transit, Turlock Irrigation District, and others.
