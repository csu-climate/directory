Name: Tomoko Komada
Campus: San Francisco
College: Science and Engineering
Department: Chemistry and Biochemistry
Title: Professor
Email: tkomada@sfsu.edu
Research Interests: 'Understanding the organic carbon cycle with emphasis on the processes
  taking place at the land-ocean margin. Utilizes natural abundance radiocarbon (14c), in
  conjunction with the stable isotope 13c, to investigate the sources, cycling, and fate of
  various organic carbon pools in the environment. Topics of interest include: sediment
  biogeochemistry and the significance of coastal benthic processes in organic matter
  dynamics, composition of organic matter suspended in rivers and its fate in the ocean,
  organic carbon preservation in salt marshes, and the role of organic-mineral associations
  in organic matter degradation and preservation.'
Teaching Interests: 'Chemistry, oceanography.'
