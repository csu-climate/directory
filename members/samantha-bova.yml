Name: Samantha Bova
Campus: San Diego
College: College of Sciences
Department: Geological Sciences
Title: Assistant Professor of Geological Sciences
Email: ''
Research Interests: 'Utilizing marine sediment cores and geochemistry to reconstruct how the
  oceans and climate have varied across earth history, understanding how ocean circulation
  alters the global climate via the movement of heat, salt, and carbon around the globe,
  examining how climate perturbations move between the high and low latitudes especially
  during past warm intervals (interstadials and interglacials) as well as periods of rapid
  change (e.g. Glacial terminations, abrupt climate events).'
Teaching Interests: 'Geochemistry, climate change science, paleoceanography, the climate
  system, oceans of change.'
Sustainability Contributions: 2021-2022 Ocean Discovery Lecturer for the US Science Support
  Program Important research about climate change and models San Diego Urban Sustainability
  Coalition Climate Ambassador.
