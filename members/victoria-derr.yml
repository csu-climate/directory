Name: Victoria Derr
Campus: Monterey Bay
College: College of Science
Department: Applied Environmental Science
Title: Professor
Email: vderr@csumb.edu
Research Interests: 'Relationships between people and places with emphasis on children and
  their environments. Environmental learning, sense of place, sustainable, resilient and
  socially just communities. How these relationships apply to community, individual health,
  sustainability, and education, particularly for under-represented communities.
  Participatory action research. Water justice. Arts-based pedagogies.'
Teaching Interests: 'Research methods in environmental studies, critical environmental
  education pedagogy, environmental thought & practice, capstone & independent research,
  social & ecological justice service learning.'
Sustainability Contributions: Engagement Lab; place-conscious and community engaged
  environmental education; water justice and water stories.
