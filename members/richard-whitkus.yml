Name: Richard Whitkus
Campus: Sonoma
College: College of Science, Technology, and Business
Department: Biology
Title: Professor
Email: whitkus@sonoma.edu
Research Interests: 'Taxonomic and phylogenetic understanding. Genetic foundations of plant
  evolution and systematics, including: speciation and diversification in hawaiian daisies
  (tetramolopium), chromosome evolution in the cyperales, genetic traits in crops and
  relatives, population genetics of umbellularia californica (California bay), host for the
  organism causing sudden oak death.'
Teaching Interests: 'BIOL 115 intro to bio, BIOL 329 plant biology, BIOL 330 plant
  taxonomy.'
Sustainability Contributions: 'Community Engagement in Restoration Ecology: Teaches
  service-learning courses where students survey native vs. Invasive plant species along
  Copeland Creek and contribute to habitat restoration. Outreach and Partnerships: Engages
  with the California Native Plant Society and the Botanical Society of California.'
