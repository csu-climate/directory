Name: Clark Lundberg
Campus: San Diego
College: College of Arts and Letters
Department: Economics
Title: Associate Professor of Economics
Email: clundberg@sdsu.edu
Research Interests: 'Natural resource and environmental economics, agricultural economics,
  international trade, applied econometrics. Current work focuses on tensions between
  agriculture and the environment, specifically the role that commodity markets and trade
  policy play in this relationship.'
Teaching Interests: 'Econometrics, macroeconomic theory, microeconomic theory, mathematical
  economics, intermediate macroeconomics.'
Sustainability Contributions: Research and publications about economics as they apply to
  deforestation, agriculture, international environmental agreements, and the environmental
  impacts of agriculture.
