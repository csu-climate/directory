Sustainability Contributions: He primarily works in urbanized estuaries (Delaware Bay and
  San Francisco Bay Estuary) where coastal pollution, including large-scale nutrient
  fertilization, has had major impacts on the microbial community. Affiliated Faculty of Cal
  Maritime Ocean Initiative.
