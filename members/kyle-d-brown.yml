Name: Kyle D. Brown
Campus: Pomona
College: College of Environmental Design
Department: Landscape Architecture
Title: Professor
Email: kdbrown@cpp.edu
Research Interests: 'Regenerative communities and sustainable resource management within
  landscape architecture. Community-based economic development, environmental education, and
  participatory processes. Environmental justice, climate change action, and ecological
  resilience in design and planning.'
Teaching Interests: 'Landscape architecture theory and design with sustainability and social
  responsibility emphasis. Design studios and courses integrating ecological health,
  community engagement, and regenerative practices. Mentoring students through collaborative
  projects like green city studio that link design, climate resiliency, and community
  needs.'
Sustainability Contributions: Lyle Center for Regenerative Studies. Environmental
  Sustainability Task Force. Co-authored Climate Action Plan for greenhouse gas reduction
  and campus resiliency. Founded Green City Studio to advance community resiliency and
  sustainability research.
