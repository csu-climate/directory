Name: Justin Myers
Campus: Fresno State
College: Social Sciences
Department: Sociology
Title: Associate Professor
Email: justinmyers@csufresno.edu
Research Interests: 'Exploring how the social organization of power shapes the distribution
  of social, economic, and environmental benefits and burdens in society, especially along
  lines of class, race, gender, and nationality. Focus in particular on how conflicts over
  the production, appropriation, and allocation of these benefits and burdens play out
  between communities, organizations, state-based actors, and corporations.'
Teaching Interests: 'Environmental sociology, sociology of food & agriculture, social
  inequality, social movements, critical theory.'
Sustainability Contributions: Environmental sociology, sociology of food & agriculture,
  environmental justice & food justice, settler colonialism, social movements.
