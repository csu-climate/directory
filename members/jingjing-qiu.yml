Name: Jingjing Qiu
Campus: San Francisco
College: Science and Engineering
Department: Chemistry and Biochemistry
Title: Associate Professor
Email: qiu@sfsu.edu
Research Interests: '(photo)electrocatalysis to create renewable energy by production of
  hydrogen gas, focusing on the anodic reaction of water splitting, including Oxygen
  Evolution Reaction (OER) and alcohol oxidation reaction. Plasmon-assisted electrocatalytic
  water oxidation to answer the role of gold on oer electrocatalysts. Interface of metal
  electrodes and alcohol molecules in the electrochemical oxidation of alcohols. Interfaces
  of photoelectrodes and electrocatalysts in photoelectrochemical water splitting.'
Teaching Interests: 'General chemistry, inorganic chemistry, and electrochemistry.'
Sustainability Contributions: The (photo)electrochemical approaches contribute to the use of
  renewable electricity and solar energy to perform chemical reactions.
