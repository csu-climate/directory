Name: Holly Sowles
Campus: Fresno State
College: Arts and Humanities
Department: Art, Design and Art History
Title: Professor, Department Chair
Email: hsowles@csufresno.edu
Research Interests: 'How ambient environments, cyber-physical systems, and intelligent
  frameworks can transform the way interiors are conceived and experienced. Explores the
  intersection of interior design, emerging technologies, and human experience in design.
  Proposed new models for integrating experiential typologies into design thinking through
  scholarship, reflecting a critical shift from 20th-century to 21st-century approaches.'
Teaching Interests: 'Intelligent design, sustainability, adaptive reuse and placemaking,
  heat mitigation through advanced technologies, and design research.'
Sustainability Contributions: 'Worked on Fresno City Bike Campus Design Development,
  designing bike shelters that mitigate the heat island effect. Bus stop design for Fresno
  Area Express: heat mitigation and placemaking.'
