Name: Sarah Cohen
Campus: San Francisco
College: Science and Engineering
Department: Biology
Title: Professor
Email: sarahcoh@sfsu.edu
Research Interests: 'How ecological, behavioral, and environmental features shape evolution
  and genetic systems in diverse organisms. How life history, physiological, or behavioral
  attributes of species affect population structure in marine and estuarine settings.
  Results often directly address questions about coastal and marine conservation related to
  our ability to detect, predict, and remediate anthropogenic effects on natural populations
  including seagrass, sea stars, sea squirts, and bryozoa. Parasite ecology and life cycle
  variation. Ecology and evolution of immunogenetic recognition systems in colonial
  invertebrates, estuarine fishes, endangered mice, and threatened marine mammals.'
Teaching Interests: 'Marine biology, invertebrate biology, ecology and evolution.'
Sustainability Contributions: Faculty at SFSU's Estuary & Ocean Science Center and the SFSU
  Department of Biology. Evaluating seagrass population health in natural and restored
  populations, remediation of sea star populations following sea star wasting disease,
  discovering remaining genetic variation in endangered, threatened, and invasive
  populations of coastal animals and plants.
