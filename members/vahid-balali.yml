Research Interests: 'Research focuses on the (1) visual data sensing and analytics for the
  aec industry, (2) virtual design and construction for infrastructure asset management and
  interoperable system integration, and (3) smart cities in transportation for sustainable
  infrastructure decision-making.'
Teaching Interests: 'Institutional, commercial, and industrial construction practices,
  earthwork and civil work construction practices, construction cost control, virtual design
  and construction, construction project management, project cost-benefit analysis,
  construction planning and cost control, construction optimization and decision making,
  construction organization and management.'
Sustainability Contributions: Research on sustainable infrastructure decision-making.
