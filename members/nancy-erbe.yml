Name: Nancy Erbe
Campus: Dominguez Hills
College: College of Arts & Humanities
Department: Negotiation, Conflict Resolution, And Peacebuilding
Title: Professor of Negotiation, Conflict Resolution, and Peacebuilding
Email: nerbe@csudh.edu
Research Interests: 'Organizational diversity and innovation, international and
  cross-cultural leadership, nonviolence and reducing violence in schools, legal and
  feminist studies on human trafficking.'
Teaching Interests: 'Climate justice, how negotiation, advocacy and conflict resolution
  skills in partnership with trustworthy allies, especially lawyers, can be used to create
  and catalyze daily justice in the most toxic organizations and communities, how these same
  skills and processes are being used around the world to create cross cultural and
  interfaith peace along with the theories social psychologists and other academics have
  found that explain our worst conflict and challenge.'
Sustainability Contributions: Publications on mediation's role with global governance, with
  major implications on environmental mediation and litigation Works with the Beahrs
  Environmental Leadership School.
