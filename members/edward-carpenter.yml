Department: Biology
Title: Professor
Email: ecarpent@sfsu.edu
Research Interests: 'Marine phytoplankton ecology, nutrient cycling, primary productivity,
  ocean acidification effects, microbial ecology. Current and future research efforts
  include microbial ecology of Antarctic dry valley glacial meltwater streams and soils,
  effects of ocean acidification on the calcifying marine phytoplankton species emiliania
  huxleyi, effects of Amazon river outflow plume on the plankton ecology of the tropical
  Atlantic ocean, and effects of anthropogenic and natural dust aerosols on marine
  phytoplankton.'
