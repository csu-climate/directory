Name: Dean Fairbanks
Campus: Chico
College: College of Behavioral and Social Sciences
Department: Geography and Environmental Studies
Title: Professor
Email: dhfairbanks@csuchico.edu
Research Interests: 'Dean is an interdisciplinary researcher who applies spatial analysis
  and remote sensing to study how landscapes shape ecological processes and human
  well-being. His work spans land cover change, biodiversity, fire–grazer dynamics, water
  markets, agricultural land values, and the spatial dimensions of hunger and food
  insecurity. By integrating satellite imagery with socioeconomic data, he examines how
  environmental and institutional forces produce uneven outcomes across regions and
  communities.'
Teaching Interests: 'Earth systems and physical geography, introduction to GIS, analysis and
  modeling in GIS, remote sensing of environment, impacts of digital society, geopolitics,
  economic geography.'
