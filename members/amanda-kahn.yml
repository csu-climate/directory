Name: Amanda Kahn
Campus: San Jose
College: College of Science
Department: Moss Landing Marine Laboratories
Title: Assistant Professor
Email: amanda.kahn@sjsu.edu
Research Interests: 'The effect of suspension feeders on local nutrient cycling (carbon,
  nitrogen, and silicon) in shallow and deep-sea habitats, feeding selectivity, niche
  partitioning, and specialization of suspension feeders, determine effective design of
  marine protected areas for benthic invertebrate species, the mechanism behind the ‘sponge
  loop’ and its ability to shunt microbial carbon into animal food webs, using novel
  visualization methods to determine whether dissolved organic carbon can be taken up
  directly by animal cells, drivers of behavior and activity of sessile benthic animals in
  shallow water and the deep sea, ecological energetics of deep-sea habitats, energetic
  costs of various physiological processes, prevalence and selectivity of microplastic
  ingestion by suspension feeders.'
