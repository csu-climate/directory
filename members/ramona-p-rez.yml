Email: ''
Research Interests: 'Power and political economy, migration and health, climate change, food
  security, and small-scale farming communities, ethics. Regional interests: Mexico, Latin
  America, current research focuses on:, binational youth identity and the effects of
  immigration on family structure, human rights in the migratory process to include
  deportation, trafficking, and the judicial treatment of migrants, the negotiations and
  practices of shifting gender roles and the maintenance of ‘traditional’ community identity
  in rural Mexico, land reform and the movement of rural lands to peri-urban space, tourism
  and ceramic production, squatter settlements and colonias populares, lead poisoning and
  the strategies of development in Mexico, the creation of community among Mexican
  immigrants and Mexican American identity in the southwestern region of the United States,
  food, its relationship to identity and the shifts in consumption, production, and
  importance as people relocate and respond to local ingredients and practices. Food
  security, climate change, shifts in farming practices among Indigenous communities in
  Mexico.'
Teaching Interests: 'Anthropology, contemporary cultures of Mesoamerica, ethnographic field
  methods, food security, shifts in farming practices, gender and ipv, ethnology, Latin
  American studies.'
Sustainability Contributions: Affiliated Faculty for the Center for Better Food Futures CoPI
  on 3 USDA grants for a total of $6, 250, 000 Ethnographic field school in Oaxaca, Mexico
  focused on food security/shifts in farming practices/nutrition.
