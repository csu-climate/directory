Research Interests: 'Improving soil health and sustainable management of productive
  agriculture in the face of climate change. Specific topics include cover crops, organic
  amendments, crop diversification, no-till, crop-livestock integration on soil health
  indicators, drought resilience and groundwater recharge, soil carbon sequestration, and
  crop-livestock research on microbial community benefits and different fractions of soil
  carbon and nitrogen.'
Teaching Interests: 'Soil health, irrigation, and crop nutrition.'
