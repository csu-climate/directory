Research Interests: 'Research primarily focuses on understanding the sources, pathways and
  fates of microplastics in urban soils and proximal marine environments and
  community-informed infrastructural interventions that mitigate their impact.'
Teaching Interests: 'Environmental chemistry, designing environmental futures, environmental
  justice, environmental ethics, science communication, principles of sustainability.'
Sustainability Contributions: Plastic reduction, understanding microplastic and microfiber
  pollution, green solutions to microplastic capture.
