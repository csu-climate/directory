Name: Beth Weinman
Campus: Fresno State
College: Science and Mathematics
Department: Earth and Environmental Sciences
Title: Professor
Email: bweinman@csufresno.edu
Research Interests: 'Sustainability, hydrogeology, sedimentology, and soils. Specific topics
  include dredging to maintain coasts in morro bay, groundwater aquifer biogeochemistry in
  Asia and the Central Valley, community-based research, soil health, and biochar-based
  carbon sequestration on farms and along the san joaquin river.'
Teaching Interests: 'Introductory geology, first-year sustainability-based critical thinking
  and lifelong learning courses, interdisciplinary hydrogeology, and climate solutions
  courses.'
Sustainability Contributions: Campus-wide High Impact Practices. Connecting climate change
  to research, teaching, and community activities. Career Center Advisory Council,
  supporting experiential and paid capstone learning opportunities (i.e., SEI Energize
  Colleges, SEI Climate Fellows, Climate Action Corps, and First Carbon Solutions).
Notes: 'Contributor to: Connecting climate change to research, teaching, and community
  activities; Sustainability at Fresno State; She''s had by far the most recommendations
  from other faculty to be on this directory.'
