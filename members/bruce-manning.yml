Department: Chemistry and Biochemistry
Title: Department Chair/Professor
Email: bmanning@sfsu.edu
Research Interests: 'Origin, fate, transport, and remediation of inorganic contaminants in
  soil and groundwater environments. Focus on the solution and surface chemistry of
  redox-sensitive elements such as(III)/(v), cr(III)/(v), se(iv)/(vi) and the analytical
  speciation of these elements in complex matrices such as soil, sediment, and wastewater.
  Specific topics include environmental remediation, chemical analysis, spectroscopy,
  microscopy and particle analysis, and chemical modeling.'
