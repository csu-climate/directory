Name: Jimmy Guilinger
Campus: Monterey Bay
College: College of Science
Department: Applied Environmental Science
Title: Assistant Professor
Email: jguilinger@csumb.edu
Research Interests: 'Process geomorphology with emphasis on disturbances related to climate
  change and human land use. Sediment dynamics, terrestrial remote sensing, geospatial
  analysis, and watershed hydrology.'
Teaching Interests: 'Geology/hydrology, geomorphic systems, river hydrology, assessment, and
  monitoring, watershed systems, environmental policy and management.'
Sustainability Contributions: Post-wildfire debris flow and erosion studies to understand
  impact on aquatic habitats. Carmel River Restoration following removal of San Clemente Dam
  to contribute to sustainable river restoration practices. Coastal Dune Erosion Dynamics
  using repeat aerial photogrammetry to inform coastal management strategies.
