Name: Andrew Wiese
Campus: San Diego
College: College of Arts and Letters
Department: History
Title: Professor of United States Urban and Environmental History
Email: awiese@sdsu.edu
Research Interests: 'Suburbanization, history of housing and planning, race, space, and
  power, the relationships between place and politics. Current research explores the role of
  place-based activism in urban environmental history and relationships among local
  politics, environmental planning, and social justice in California.'
Teaching Interests: 'Urban and environmental history, global environmental problems, history
  of California, emphasizing the application of history to contemporary issues.'
Sustainability Contributions: 'Active in community planning, environmental politics and
  stewardship Wrote The Green City: Environmental Politics and Planning in San Diego since
  1960.'
