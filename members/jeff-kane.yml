Name: Jeff Kane
Campus: Humboldt
College: College of Natural Resources & Sciences
Department: Forestry, Fire & Rangeland Management
Title: Professor Fire Ecology & Fuels Management
Email: jkane@humboldt.edu
Research Interests: 'Explore the impacts of fire and other disturbances on wildlands and to
  provide information that will improve the management, restoration, and conservation of
  these ecosystems. Fuel moisture dynamics, interactive effects of disturbances (fire,
  beetles, and drought) on tree mortality, climate change effects on fire and forest
  dynamics, fuel treatment impacts and effectiveness, understory plant response to fire and
  fuel treatments, flammability and defense traits in plants, forest restoration and
  conservation.'
Teaching Interests: 'Use research to actively involve undergraduate students both inside and
  outside of the classroom. Fire behavior and effects, fuels monitoring and management,
  applied fire use and policy, fire internship, and applied fire capstone.'
Sustainability Contributions: Resilience strategies, applied restoration, community-informed
  initiatives, professional development.
