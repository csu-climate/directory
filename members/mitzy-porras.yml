Name: Mitzy Porras
Campus: San Francisco
College: Science and Engineering
Department: Biology
Title: Assistant Professor
Email: mitzyfpb@sfsu.edu
Research Interests: 'How abiotic and biotic stressors alter interactions among species
  (microbes, plants, invertebrates) and the implications on the structure and function of
  populations and communities. This work encompasses molecular biology, physiology,
  behavioral analysis, population and community ecology, GIS, as well as electrical
  engineering. Results are applied in species management strategies (e.g., sterile insect
  technique).'
Teaching Interests: 'Behavioral ecology, principles of ecology, entomology.'
Sustainability Contributions: Research on sustainable agriculture and pest management under
  climate change scenarios (drought and heatwaves).
