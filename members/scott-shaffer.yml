Name: Scott Shaffer
Campus: San Jose
College: College of Science
Department: Biological Sciences
Title: Professor of Biological Sciences
Email: scott.shaffer@sjsu.edu
Research Interests: 'Professor shaffer''s research lab primarily focuses on seabirds as
  model to understand how animals exploit marine resources across vast ocean scapes and
  coastal habitats. This includes the use of biologging tools (e.g. Tracking devices,
  accelerometers, time depth recorders) to explore the behavioral flexibility, effort, and
  distribution of seabirds that forage throughout the north Pacific.'
Teaching Interests: 'He teaches courses related to ecology and evolution, and marine biology
  including conservation biology, ecology, experimental sampling design and analysis, and
  physiological ecology.'
Sustainability Contributions: His research adds to the ecological base of knowledge about
  marine animals and their habitat use, which supports the creation of or maintenance of
  marine protected areas. In a more applied capacity, he is a part of a team focused on
  understanding seabird interactions with vessels at sea to reduce bycatch. Finally, he is a
  member of several working groups focused on the potential impacts of ocean wind energy
  development on marine megafauna.
