Name: Tom Connolly
Campus: San Jose
College: College of Science
Department: Physical Oceanography
Title: Associate Professor
Email: thomas.p.connolly@sjsu.edu
Research Interests: 'Remote forcing and seasonal currents in the California current system,
  physical drivers of phytoplankton concentrations along the central California coast,
  impacts of circulation on coastal hypoxia and ocean acidification, wind and wave-driven
  circulation over the inner continental shelf, enhancement of upwelling and internal wave
  energy in submarine canyons, nutrient and salt fluxes in seasonally hypersaline estuaries
  (e.g. Moro cojo slough), use of new sensor technology to investigate fine-scale
  variability in physical and biogeochemical processes.'
Teaching Interests: ''
Sustainability Contributions: Research on the impacts of hypoxia and ocean acidification as
  a result of climate change.
