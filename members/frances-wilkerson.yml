Name: Frances Wilkerson
Campus: San Francisco
College: Science and Engineering
Department: Biology
Title: Adjunct Professor
Email: fwilkers@sfsu.edu
Research Interests: 'Nutrients, productivity, algae, and algal blooms in estuarine and
  coastal upwelling ecosystems. Focuses include nitrogen cycling in aquatic systems and how
  fluxes of nitrate and ammonium affect phytoplankton, primary production, and the
  biological pump. Impacts include anthropogenic nutrients from wastewater treatment
  practices, harmful algae, and restoration of wetland systems in addition to carbon fluxes
  and global climate change.'
Teaching Interests: 'Marine biology, algae biology.'
