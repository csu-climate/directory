Name: Loren Cannon
Campus: Humboldt
College: College of Arts, Humanities & Social Sciences
Department: Department Of Critical Race, Gender, & Sexuality Studies
Title: Lecturer
Email: llc33@humboldt.edu
Research Interests: 'Applied and environmental ethics, transgender theory and feminist
  ethics, ethical theory and legal theory.'
Teaching Interests: 'Developed and taught courses in philosophy, ethics, and crgs that
  integrate environmental and social justice topics, enriching students’ understanding of
  sustainability from multiple dimensions — ecological, social, and ethical.'
Sustainability Contributions: 'Intersectionality & Social Justice in Sustainability: brings
  an important social justice and equity perspective to sustainability, aligning with the
  increasingly recognized need for intersectional approaches to sustainability that include
  human rights and inclusivity. Also a Core Faculty of the Environment & Community M.A.
  Program, Dr. Cannon is directly involved in graduate education related to sustainability
  and community development.'
