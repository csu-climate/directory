Research Interests: 'Plant-animal interactions, with a particular focus on seed dispersal
  and frugivory. Many projects are geared towards documenting understudied interactions,
  assessing the structure of mutualisms at the individual-individual and species interaction
  levels, and examining how interactions are impacted by human-driven environmental change
  in the form of habitat fragmentation, hunting, and climate.'
