Name: Hilary McMillan
Campus: San Diego
College: College of Arts and Letters
Department: Geography
Title: Professor of Geography, Master’s Program Advisor
Email: hmcmillan@sdsu.edu
Research Interests: 'Changes in hydrological processes with space, time and scale,
  hydrological predictions on national to continental scales, uncertainty in hydrological
  data and predictions, water resources, impact of humans on watershed processes,
  socio-hydrology.'
Teaching Interests: 'Environmental hydrology, hydrology and global environmental change,
  practical hydrologic modeling.'
Sustainability Contributions: The McMillan Hydrology Lab focuses on studying hydrology and
  water resources to improve understanding of hydrologic processes and build accurate
  quantitative models to predict river flow, soil moisture, groundwater recharge and other
  quantities Has worked in the UK and New Zealand on collaborative projects related to flood
  forecasting and soil moisture patterns Hydrology research, presentations, and courses
  taught.
