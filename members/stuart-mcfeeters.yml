Research Interests: 'Development of remote sensing and GIS analytical techniques to monitor
  the environment. Recent research investigated the application of such techniques to the
  detection of untreated swimming pools in an urban setting to assist mosquito abatement,
  and to the improved characterization of aquatic and terrestrial plant communities in
  wetland ecosystems.'
Teaching Interests: 'Introduction to weather and climate, physical geography, violent
  weather/climatic hazards, remote sensing.'
