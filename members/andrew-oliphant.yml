Name: Andrew Oliphant
Campus: San Francisco
College: Science and Engineering
Department: Environment
Title: Professor and School Director
Email: andrewo@sfsu.edu
Research Interests: 'Interactions between earth''s surface and its atmosphere, including
  exchanges of energy, water and carbon, and how they change over space and time. Primarily
  involves field-based observations using micrometeorological methods. Current projects
  include mountain meadow carbon cycling, monitoring emissions from healthy soils projects,
  and ongoing projects on urban and microclimates of the San Francisco Bay Area.'
Teaching Interests: 'Climate, climate change, bioclimatology, physical environment, field
  methods.'
Sustainability Contributions: Carbon sustainability, urban climate mitigation, montane
  meadow carbon restoration.
