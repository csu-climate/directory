Name: Kevin Fingerman
Campus: Humboldt
College: College of Natural Resources & Sciences
Department: Environmental Science and Management
Title: Professor Energy & Climate
Email: Kevin.Fingerman@humboldt.edu
Research Interests: 'Water/energy nexus, bioenergy, life cycle assessment (LCA). Research is
  driven by an interest in the broad-based environmental and social impacts of energy
  technologies and policies.'
Teaching Interests: 'Teaches sustainability-focused courses integrating real-world
  environmental problem solving, such as ENVS 230: environmental problem-solving. Co-teaches
  campus greenhouse gas emissions inventory and reduction projects for facilities
  management. Serves as the graduate coordinator for the environmental systems m.s.
  Program.'
Sustainability Contributions: Researches environmental impacts of energy systems, especially
  bioenergy and water/energy nexus Leads projects on forest biomass energy and wildfire
  management, informing climate policy Studies waste-to-energy pathways to support renewable
  fuel and electric vehicle policies Worked with UN FAO on biofuel policy impact assessments
  in Indonesia and Colombia.
