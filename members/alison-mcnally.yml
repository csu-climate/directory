Research Interests: 'Professor mcnally is interested in understanding how physical
  environments that have developed under unique conditions may evolve under changing
  conditions (i.e. A changing climate, particulate deposition on landscapes, chemical
  applications), and how these new conditions affect the distribution of plant and animal
  species. She is also interested in water accessibility and sustainability issues.'
Teaching Interests: 'Field methods, physical geography, and geospatial applications.'
