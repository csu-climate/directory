Name: Chris Ivey
Campus: Chico
College: College of Biological Sciences
Department: Biological Sciences
Title: Associate Professor
Email: ctivey@csuchico.edu
Research Interests: 'Dr. Ivey studies the evolution and ecology of plants and insects. His
  work focuses on plant-insect interactions, the evolution of mating systems, reproductive
  ecology, and plant defense. His current projects include studies of genetic variation and
  phenotypic selection of mating system and physiological traits in clarkia and mimulus,
  identifying patterns and mechanisms of speciation in mimulus, and testing how induced
  anti-herbivore defenses alter sex allocation in mimulus guttatus.'
Teaching Interests: ''
Sustainability Contributions: One of his lab's recent projects studied how valley oak trees,
  both a keystone and indicator species, may be impacted by climate change.
