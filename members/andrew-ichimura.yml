Name: Andrew Ichimura
Campus: San Francisco
College: Science and Engineering
Department: Chemistry and Biochemistry
Title: Professor
Email: ichimura@sfsu.edu
Research Interests: 'Materials with applications in the production of energy and
  environmental remediation. Crystal growth and photophysics of titanium dioxide (tio2) thin
  films and other semiconductor materials that can be used in photovoltaic cells, the
  production of oxygen from water, and the production of reactive oxygen species for the
  remediation of organic pollutants in water.'
Teaching Interests: 'Physical chemistry, writing and communication skill development, X-ray
  techniques.'
Sustainability Contributions: Oxygen and hydrogen evolution reactions; photophysics of
  electron transfer; low-cost non-toxic route to water decontamination.
