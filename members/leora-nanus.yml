Research Interests: 'Current research includes understanding controls on spatial and
  temporal variation in water quality, evaluating ecological effects of air and water
  pollution, modeling critical loads of atmospheric nitrogen, applying stable isotope
  techniques to distinguish sources of pollutants to watersheds, and vulnerability of the
  water-energy-food nexus.'
Teaching Interests: 'Hydrology, water quality, watershed restoration, environmental
  management.'
Sustainability Contributions: Hydrology, water quality, environmental science, resource
  management, watershed biogeochemistry, ecohydrology, GIS &amp; environmental modeling.
