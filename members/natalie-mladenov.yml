Name: Natalie Mladenov
Campus: San Diego
College: College of Engineering
Department: Civil, Construction, and Environmental Engineering
Title: Professor, P.E., William E. Leonhard, Jr. Chair, Director of the Water Innovation
  and Reuse Lab
Email: nmladenov@sdsu.edu
Research Interests: 'Biogeochemical processes influencing pollutant fate and transport in
  natural and engineered systems, anaerobic processes for decentralized wastewater
  treatment, nutrient removal and energy recovery, research focuses on fundamental processes
  driving photochemical and biological degradation and mobilization of contaminants and
  applies optical spectroscopic techniques for monitoring organic contaminants.'
Teaching Interests: 'Designing solutions for environmental problems, environmental
  engineering, physical and chemical processes of water pollution control, biological
  processes and bioremediation.'
Sustainability Contributions: Sustainable water reuse Net zero energy and reducing
  nutrient-rich discharges from wastewater treatment Mitigating urban water pollution.
