Name: Andy Stubblefield
Campus: Humboldt
College: College of Natural Resources & Sciences
Department: Forestry, Fire & Rangeland Management
Title: Professor Hydrology and Watershed Management
Email: aps14@humboldt.edu
Research Interests: 'Water quality monitoring, chemistry and instrumentation. Methods for
  the assessment of erosional processes, sediment budgets, naturally occurring
  radionuclides, and erosion plot studies. Ecosystem health assessment.'
Teaching Interests: 'WSHD 310 hydrology and watershed management, WSHD 333 wildland water
  quality, WSHD 424 watershed hydrology, WSHD 458/558 climate change and land use.'
Sustainability Contributions: 'Contributed to Fifth California Climate Change Assessment for
  North Coast. Water-quality monitoring & sediment budget research, using instruments,
  erosion plots, and radionuclide tracers to measure the fate and movement of fine sediment
  and nutrients. Climate‑change and thermal-stream studies: modeling stream temperature
  responses to riparian reforestation and climate warming using distributed sensing and HEAT
  SOURCE models to support salmonid habitat conservation. Securing and deploying research
  funding for field-intensive, restoration-oriented studies that inform sustainable forest
  and watershed management across Northern California. Coordinating lead author of the north
  coast regional report, part of the 5th climate assessment.'
