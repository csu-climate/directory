Research Interests: 'Relationships between locomotion, environment, and energetics. How
  different flight environments (eg. Low humidity, high elevation) influence the energetics
  of flight in birds, and potential evolutionary strategies (such as morphological and
  physiological adaptations) that permit efficient flight in environmentally challenging
  locales. Predict how flying animals will be affected by the changing climate, and if we
  are able to make predictions about their flight capabilities.'
