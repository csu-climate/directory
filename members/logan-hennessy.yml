Name: Logan Hennessy
Campus: San Francisco
College: Liberal & Creative Arts
Department: Liberal Studies
Title: Associate Professor
Email: loganh@sfsu.edu
Research Interests: 'Environmental politics, the political economy of the mining and oil
  industries, and environmental history in the americas, primarily in Ecuador and guyana.
  Examining the social and environmental consequences of infrastructure projects in South
  America, the nuances of sustainability in attempts to reform the mining industry, and
  Indigenous rights in climate change debates over the protection of forests in united
  nations negotiations.'
Teaching Interests: 'Environmental themes of international development, along with a course
  devoted to the study of tropical forest ecology, causes of destruction, and prospects for
  conservation, and the junior and senior seminar courses for liberal studies.'
