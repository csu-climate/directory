Name: Peter Atterton
Campus: San Diego
College: College of Arts and Letters
Department: Philosophy
Title: Professor of Philosophy, Affiliated Faculty of Jewish Studies
Email: atterton@sdsu.edu
Research Interests: '20th-century European philosophy (esp. Heidegger, Levinas, & Derrida),
  phenomenology, philosophical darwinism, animal philosophy, has written works on Darwin,
  Heidegger, Nietzsche, Kant, michel Foucault, jacques Derrida, Shakespeare, psychoanalysis,
  human rights, human extinction, animal ethics, and the sci-fi movie blade runner, has done
  extensive work on emmanuel Levinas.'
Teaching Interests: 'Environmental ethics, existentialism, bio-medical ethics, 20th-century
  continental philosophy, philosophy of technology.'
Sustainability Contributions: 'Face-to-Face with Animals: Levinas and the Animal Question
  (co-edited with Tamra Wright) (Albany: SUNY Press, 2019). Animal Philosophy: Essential
  Readings in Continental Thought (co-edited with Matthew Calarco, and with a preface by
  Peter Singer) (New York: Continuum, 2004).'
