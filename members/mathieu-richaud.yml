Name: Mathieu Richaud
Campus: Fresno State
College: Science and Mathematics
Department: Earth And Environmental Sciences
Title: Associate Professor
Email: mathieu@csufresno.edu
Research Interests: 'Paleoceanography, global biogeochemical cycles, micropaleontology
  (foraminifera), coastal geology via drone and LiDAR. Specific topics have included
  investigation of mechanisms that relate glacial/interglacial periods and CO2, mapping of
  coastal erosion at the morro bay sandspit along California''s Central Coast,
  reconstructing paleodepth estimates of the canterbury basin in New Zealand, and assessing
  how benthic foraminiferal shell geochemistry is sensitive to the geochemical conditions
  microhabitats.'
Teaching Interests: 'Environmental science, environmental sampling, atmospheric science,
  ocean and climate science.'
