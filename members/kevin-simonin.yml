Name: Kevin Simonin
Campus: San Francisco
College: Science and Engineering
Department: Biology
Title: Associate Professor
Email: simonin@sfsu.edu
Research Interests: 'Plant physiological ecology. Plant physiological controls over carbon,
  water, and nutrient transport between soils, plants, and the atmosphere. Understanding how
  natural ecosystems and human reconfigured ecosystems respond to a changing climate.
  Current research relates variation in a plant structure (anatomy) to physiological
  function in both fields and laboratory settings, including the use of biophysical models
  to predict plant physiological responses to changes in the environment.'
