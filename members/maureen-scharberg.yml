Research Interests: 'Teaching of chemistry to health science and non-science majors,
  developing chemistry curriculum and providing research opportunities to investigate the
  chemistry and active components of food ingredients, natural products, and plant chemistry
  traditionally used by the ohlone and bay miwok tribes.'
Teaching Interests: 'Chemistry of spices, health science chemistry for pre-nursing majors,
  green chemistry and sustainable chemistry for non-stem majors.'
Sustainability Contributions: Making sustainability through the lens of chemistry accessible
  to all through undergraduate curriculum development and course offerings.
