Name: Shawn Rosenmoss
Campus: San Francisco
College: Science and Engineering
Department: Environment
Title: Lecturer
Email: srosenmoss@sfsu.edu
Research Interests: 'Integrating climate communications into other subject areas.'
Teaching Interests: 'Environmental studies, electric utilities, energy systems and energy
  democracy, municipal sustainability and climate action, history of environmentalism,
  environmental justice, climate change, the environmental impact of colonialism and
  capitalism on the Global South, and climate communications.'
Sustainability Contributions: Committed to diversifying the face of the climate movement;
  consultant on energy projects for mid-sized municipalities; creating partnerships with a
  diverse range of organizations for climate communications; advisor to workforce
  development organizations on just transition and workforce development in the energy
  sector; former Manager of Development, Community Partnerships and the SF Carbon Fund at
  the San Francisco Department of the Environment. Sits on the boards of the Climate Music
  Project and Mission Science Workshop.
