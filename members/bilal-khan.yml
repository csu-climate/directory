Name: Bilal Khan
Campus: San Bernardino
College: College of Natural Sciences
Department: School of Computer Science and Engineering
Title: Assistant Professor
Email: bilal.khan@csusb.edu
Research Interests: 'Develop analytical and advanced machine/deep learning approaches for
  causal analysis and decision support modeling for autonomous and smart water treatment,
  human behavioral analysis using computer vision, real-time embedded systems (sensor
  networks and IoT) for resource management, data science (big/time-series data) for water
  consumption/supply and water use prediction for small disadvantaged communities, safer
  design and use of nanotechnology (nanotoxicology & nanomaterial exposure assessment) using
  machine learning, predictive modeling and data mining approaches, mobile and web
  application development, water treatment technology - cyber-infrastructure for virtual
  water treatment systems.'
Teaching Interests: 'Artificial intelligence (machine learning, deep reinforcement learning,
  computer science), data science, mobile and web application development, software
  engineering, operating systems.'
Sustainability Contributions: Developed and maintained an online nanoinformatics platform
  for environmental impact assessment of engineered nanomaterials (ENMs) Working on
  developing analytical and advanced machine/deep learning approaches for autonomous and
  smart water treatment systems Developed the largest online database of nanomaterials (Nano
  Databank) in the field of nanotechnology that consists of the studies on ENM toxicity,
  characterization and exposure analysis Developed data-driven models and cloud-based
  cyber-infrastructure for water use patterns of small agricultural communities and the
  development of virtual water district (California) Co-developed a patent pending
  technology for membrane-based reverse-osmosis (RO) water treatment that utilizes software
  engineering principles and deep learning approaches for real-time detection and
  identification of membrane fouling and scaling.
