Name: Anthony Silvaggio
Campus: Humboldt
College: College of Arts, Humanities & Social Sciences
Department: Sociology
Title: Associate Professor
Email: anthony.silvaggio@humboldt.edu
Research Interests: 'Environmental sociology, social movements, green criminology, survey
  research methods, and law and social control.'
Teaching Interests: 'Also an associate professor in environmental studies program. Courses
  in environmental sociology, social movements, cannabis policy, survey methods, and
  environmental studies & sociology curriculum.'
Sustainability Contributions: Research-driven advocacy on the environmental consequences of
  cannabis policy and infrastructure, highlighting water use, pollution, regulatory impacts,
  and ecosystem strain. Active in green criminology, analyzing how policy shapes
  environmental harm and justice enforcement Featured speaker at the Cannabis and
  Environmental Stewardship Symposium in 2024 which combined ecological awareness with
  industry practices.
