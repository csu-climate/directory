Name: Katherine Cushing
Campus: San Jose
College: College of Social Sciences
Department: Environmental Studies
Title: Department Chair
Email: katherine.cushing@sjsu.edu
Research Interests: 'Water resource management, specifically reuse, environmental education
  effectiveness, sustainability in higher education.'
Teaching Interests: 'Water policy, water resources management, qualitative research methods,
  and environmental policy.'
Sustainability Contributions: Professor Cushing was the university's first Sustainability
  Director and helped establish the university's sustainability board. She serves as a board
  member of Monte Jade and sits on the Santa Clara Valley Water District’s Independent
  Advisory Panel for Potable Reuse. Taught and conducted research on enhancing our
  understanding of how environmental policies and programs are implemented from an
  interdisciplinary perspective.
