Research Interests: 'Evolutionary ecology, molecular ecology, conservation genetics,
  invasion biology. Focuses on how surrounding ecological environments have evolutionary
  consequences for organisms and their dynamics, current research projects:, changes in soil
  microbiome caused by carpobrotus edulis and its ecological implications, gene expression
  to understand endemic plants’ response to climate change, plant ancient genomics, the role
  of clonality in invasive species.'
Teaching Interests: 'Ecology and evolution of invasive species, genomics, botany.'
