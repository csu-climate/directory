Name: Pablo K. Cornejo-Warner
Campus: Chico
College: College of Engineering, Computer Science, and Construction Management
Department: Civil Engineering
Title: Assistant Professor
Email: pcornejo-warner@csuchico.edu
Research Interests: 'Professor cornejo-warner''s research focuses on life cycle
  environmental impacts of wastewater and resource recovery management strategies, as well
  as multi-criteria decision support frameworks for sustainable drinking water treatment
  systems. Other research interests include greenhouse gas models for water reuse and
  desalination facilities, the water-energy-food nexus, and water and sanitation issues in
  the developing world.'
Teaching Interests: 'Teaching interests include environmental engineering, sustainability,
  engineering economic analysis.'
Sustainability Contributions: Professor Cornejo is working on sustainable water and
  wastewater management issues in the Civil Engineering Department.
