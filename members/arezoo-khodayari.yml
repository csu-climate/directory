Name: Arezoo Khodayari
Campus: Los Angeles
College: College of Engineering, Computer Science, and Technology
Department: Civil Engineering
Title: Associate Professor
Email: akhoday@calstatela.edu
Research Interests: 'Development of sustainable engineering solutions for the prevention and
  control of water and air pollution, wastewater treatment, reuse, and resource recovery,
  air quality analysis and climate modeling, energy–water–climate nexus, environmental
  impact assessment and systems analysis.'
Teaching Interests: 'Environmental engineering, environmental sustainability and renewable
  energy, environmental mass transport, technological aspects of the urban environment,
  communication for civil engineers, mentoring student teams in environmental engineering
  design competitions.'
Sustainability Contributions: 'Founding Director of the Environmental Sustainability and
  Pollution Control Research Laboratory, Co-Founder of the Astrobiology and Environmental
  Engineering Initiative, an interdisciplinary effort that integrates planetary science and
  environmental engineering to advance sustainable solutions for wastewater treatment and
  resource recovery, Director of Urban Sustainability Minor at Cal State Los Angeles.'
