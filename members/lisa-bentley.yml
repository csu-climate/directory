Name: Lisa Patrick Bentley
Campus: Sonoma
College: College of Science, Technology, and Business
Department: Biology
Title: Associate Professor
Email: lisa.bentley@sonoma.edu
Research Interests: 'Plant ecophysiology, plant physiology, community and ecosystem ecology,
  tropical ecology, forest dynamics, remote sensing, using Bayesian approaches to study
  climate impact on forests.'
Teaching Interests: 'Ecology, plant biology, and environmental science. Classes include:
  BIOL 131 - biological diversity and ecology, BIOL 315 - plants and society, BIOL 320 -
  ecology and evolution: an integrated approach, BIOL 348 - plant physiology, BIOL 351 -
  climate change biology, BIOL 350 - plant physiological ecology, BIOL 490 - research
  experience in biology.'
Sustainability Contributions: Skydio drone in project 3DForests to assess forest biomass and
  fire fuel parameters. Provides mechanistic insights into forest resilience and drought
  responses, informs climate adaptation in ecosystems.
