Name: Yolonda Youngs
Campus: San Bernardino
College: College of Social & Behavioral Sciences
Department: Geography And Environmental Studies
Title: Professor
Email: yyoungs@csusb.edu
Research Interests: 'Long term environmental monitoring (LTEM), environmental and cultural
  geography, national parks and unesco protected areas, environmental justice, social
  science GIS, conservation of natural resources, environmental policy and land management,
  and field methods. Current research includes projects focused on Long Term Environmental
  Monitoring (LTEM) using repeat photography and intensive field studies in western u.s.
  National parks, protected areas, public lands, and unesco sites in rivers, lakes, coastal
  and marine areas, high desert, and mountain environments.'
Teaching Interests: 'Conservation and natural resources, environmental sustainability,
  national parks and public lands, environmental justice, coastal resources management,
  environmental policy & impact assessment.'
Sustainability Contributions: 'Published Framing Nature: The Making of an American Icon at
  the Grand Canyon, focused on environmental management and policy, popular imagery,
  tourism, environmental justice, and cultural heritage in the Greater Grand Canyon Region,
  along with other publications Published The American Environment Revisited: Environmental
  Historical Geographies of the United States (2018, edited with Geoffrey Buckley) Research
  projects contribute to long term environmental monitoring and restoration efforts Research
  funded by grants from the National Science Foundation, the U.S. National Park Service,
  Association of Pacific Coast Geographers, National Endowment for the Humanities,
  Association of Pacific Coast Geographers, and the Association of American Geographers
  Collaboration with ecologists and environmental managers at the San Bernardino Municipal
  Water District (SBV) on a newly funded long term environmental monitoring project of the
  Santa Ana River Watershed and San Bernardino Mountains.'
