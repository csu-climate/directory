Name: Aaron Gregory
Campus: Humboldt
College: College of Arts, Humanities & Social Sciences
Department: Native American Studies Department, Environmental Resources Engineering
Title: Assistant Professor
Email: ag788@humboldt.edu
Research Interests: 'Explores lithium as a source of energetic and political power, and as a
  more-than-human actor that enrolls and articulates a range of state, technoscientific and
  Indigenous actors into new socio-technical kinship relations. Other areas of interest:
  science & technology studies (STS), critical infrastructure studies, Indigenous studies,
  political ecology, land restitution and restoration, ecological personhood, postcolonial
  theories, decolonizing research methodologies, and community-based research.'
Teaching Interests: 'Teaches courses in Native American studies, focusing on the
  intersection of Indigenous knowledge systems and contemporary environmental issues.
  Involved in organizing academic events, such as the 4th annual post-capitalism conference
  and decolonizing economies summit, where he co-organized a panel on food & seed
  sovereignty highlighting the rou dalagurr food sovereignty lab and traditional ecological
  knowledge institute at Cal Poly Humboldt.'
