Name: Wim Kimmerer
Campus: San Francisco
College: Science and Engineering
Department: Biology
Title: Adjunct Professor Emeritus, Biology
Email: kimmerer@sfsu.edu
Research Interests: 'Small pelagic organisms in primarily the San Francisco estuary, and
  their success in response to varying freshwater input, strong tides, and abundant
  introduced species and predators. Specific topics include how freshwater flow moves the
  salinity gradient, population dynamics of key zooplankton species, the planktonic food web
  supporting longfin smelt, delta smelt, and other fishes of the upper estuary, modeling the
  declining delta smelt population, effects of species introductions to the estuary,
  wetlands as habitat for planktonic organisms, and the management implications of these
  findings.'
