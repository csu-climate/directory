Name: Tom Robinson
Campus: Sonoma
College: College of Humanities, Social Sciences, and the Arts
Department: Geography, Environment, and Planning
Title: Lecturer
Email: robinsont@sonoma.edu
Research Interests: 'GIScience for climate adaptation: advancing geospatial methods to
  support climate-resilient land-use and conservation decision-making. Spatial modeling of
  natural systems: developing and applying spatial models to understand ecosystem processes,
  connectivity, and change over time. Decision support for conservation planning:
  integrating spatial data, scenario analysis, and stakeholder priorities to guide adaptive
  management and policy.'
Teaching Interests: 'Applied GIS and spatial analysis for climate solutions: teaching
  students to use geospatial tools and data-driven reasoning to understand, model, and
  address climate and conservation challenges. Integrative conservation planning and
  decision support: guiding emerging professionals to evaluate, design, and communicate
  spatial strategies that balance ecological integrity with human needs.'
Sustainability Contributions: Leads strategic planning and analysis projects that serve the
  public good.
