Name: Arturo Pacheco-Vega
Campus: Los Angeles
College: College of Engineering, Computer Science, and Technology
Department: Mechanical Engineering
Title: Professor
Email: apacheco@calstatela.edu
Research Interests: 'Simulation and control of thermal systems, soft computing technologies
  (artificial intelligence), system and process optimization, heat and fluid flow data
  analysis, nonlinear dynamical systems, analytical and numerical methods for PDEs,
  micro-scale fluid flow and heat transfer, electronic cooling, thermal synchronization,
  energy efficiency in building systems, fractional differential equations and applications,
  biologically-inspired systems and techniques.'
Teaching Interests: 'Heat conduction, heat convection, energy systems, mechanical
  engineering analysis, advanced mechanical engineering analysis, dynamics I, thermodynamics
  II, control of mechanical systems, fluid mechanics I and laboratory, heat transfer I,
  matrix algebra for engineers, introduction to numerical methods for engineers I.'
Sustainability Contributions: 'Director of the Sikand Center for Sustainable and Intelligent
  Infrastructure (SITI), Director of the CREST Center for Advancement Toward Sustainable
  Urban Systems (CATSUS), Previous Director of the CREST Center for Energy and
  Sustainability (CEaS).'
