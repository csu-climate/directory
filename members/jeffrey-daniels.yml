Name: Jeffrey Daniels
Campus: East Bay
College: College of Health
Department: Public Health
Title: Lecturer
Email: jeff.daniels@csueastbay.edu
Research Interests: 'Human health risk from multimedia, multi pathway exposure to toxins
  (e.g., chemical, biological, radiological, emerging), disease prevention, epidemiology,
  toxicology, and environmental health policy.'
Teaching Interests: 'Environmental health and policy, climate change, disease outbreaks,
  epidemiology, toxicological risk and health physics, precautionary principle.'
Sustainability Contributions: Interests include prospective and retrospective health risk
  assessments for substances of toxicological concern introduced into environmental media
  based on consideration of multiple exposure pathways. Worked for the Lawrence Livermore
  National Laboratory in Livermore, NASA Ames Research Center at Moffett Field, and The
  Desert Research Institute of the Nevada System of Higher Education in Las Vegas.
  Appointments include review committees for the National Academies of Science, Engineering,
  and Medicine (NASEM). .
Notes: 'Currently employed by CSU East Bay as a Lecturing Professor for the
  Department of Public Health.'
