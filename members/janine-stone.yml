Research Interests: 'Dr. Stone is interested in how consumers respond to municipal water and
  energy policies used in the western United States. Her research has addressed areas
  including household responses to water pricing and drought policies, support for policies
  used to decrease permanent sales of agricultural water rights, and acceptability of
  bioenergy policies.'
