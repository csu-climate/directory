Name: Kiki Patsch
Campus: Channel Islands
College: College of Arts and Sciences
Department: Environmental Science and Resource Management
Title: Department Chair and Associate Professor
Email: kiki.patsch@csuci.edu
Research Interests: 'Current research focuses on coastal geomorphology and processes,
  shoreline hazard assessment, sediment budgets analysis, sea cliff and beach erosion,
  reductions in the natural supply of sediment to the coast, coastal armoring, and coastal
  access equity along the California coast.'
Teaching Interests: 'Beaches and coastal geomorphology, physical oceanography, and
  geospatial analysis, emphasizing hands-on fieldwork, UAV monitoring, and clear,
  audience-ready maps for California coastal settings.'
Sustainability Contributions: Studying how coasts are and will be affected by climate change
  and human activity including erosion and sea level rise. Co-authored Beaches on the Edge.
