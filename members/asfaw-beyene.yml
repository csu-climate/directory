Name: Asfaw Beyene
Campus: San Diego
College: College of Engineering
Department: Mechanical Engineering
Title: Professor of Mechanical Engineering
Email: abeyene@sdsu.edu
Research Interests: 'Energy efficiency - improving system or component performance utilizing
  low grade thermal energy, renewable energy - using computational fluid dynamics to improve
  energy recovery from wind and wave, ongoing projects: adaptive motion, combined heat and
  power systems for ultra-low grade heat recovery, heat recovery from traction engines for
  absorption chillers, and ozone-free refrigerants for low grade heat recovery.'
Teaching Interests: 'Areas of expertise: renewable energy, thermodynamic cycles, energy
  analysis, mathematical modeling, simulation of thermal systems.'
Sustainability Contributions: Thermal science and wind energy research Has won numerous
  grants from US Department of Energy, San Diego Gas and Electric, California Energy
  Commission, Oak Ridge National Lab, University City Science Center, Lockheed Martin,
  California Institute for Energy Efficiency, and Southern California Edison Co.
