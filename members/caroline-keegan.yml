Name: Caroline Keegan
Campus: Sacramento State
College: College of Natural Sciences & Mathematics
Department: Geography
Title: Assistant Professor
Email: c.keegan@csus.edu
Research Interests: 'Political ecologies of labor and agriculture, environmental, climate,
  and food justice, social movements, critical human geography, racial capitalism, feminist
  methodologies, community-engaged research.'
Teaching Interests: 'Political ecology, nature, and justice, geographic ideas and skills,
  suburban and rural field geographies, courses that incorporate student-led research,
  community engagement, real-world skill-building, and critical analyses of power structures
  related to society and nature.'
Sustainability Contributions: 'Interested in how intensifying climate crises (extreme heat
  and volatile weather events) affect low-wage workers, especially migrant workers and
  farmworkers. Food Justice efforts: - Faculty Research Partner at Soil Born Farms (PI,
  “Growing Diaspora: Student-Led Research into the Cultivation and Preparation of Cultural
  Staple Foods for Local Immigrant and Refugee Communities”) - PI, “Aggies Cultivating Food
  Security for Immigrant Families, ” Texas A&M University - Former Faculty mentor for the
  "Howdy Hive, " establishing beehives at the student-run community garden.'
