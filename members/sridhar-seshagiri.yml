Name: Sridhar Seshagiri
Campus: San Diego
College: College of Engineering
Department: Electrical and Computer Engineering
Title: Professor
Email: ''
Research Interests: 'Broad areas of nonlinear control, adaptive approximation based control,
  and applications to machines/drives, and renewable energy technologies (photovoltaics,
  wind energy systems and storage), current research projects:, control for battery
  management systems, hybrid Energy Storage Systems (HESS) for grid integration of
  renewables, hybrid and nonlinear control of power converters, power optimization and
  control for PV and Wind Energy Conversion Systems (WECS), distributed wide-area control of
  power systems.'
Teaching Interests: 'Circuit analysis i and II, computation and statistical methods for
  electrical engineers, signals and systems, feedback control systems, power distribution
  systems, power electronics, digital control systems, power distribution systems, power
  electronics, renewable energy systems, linear system theory and design, linear optimal
  control.'
Sustainability Contributions: Research applications to photovoltaic cells and renewable
  energy systems Energy efficiency research.
