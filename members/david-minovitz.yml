Name: David Minovitz
Campus: Monterey Bay
College: College of Science
Department: Applied Environmental Science
Title: Lecturer
Email: dminovitz@csumb.edu
Research Interests: 'Water quality monitoring, seafloor mapping, marine spatial planning,
  coastal watershed dynamics, and the use of geospatial and remote sensing tools for
  environmental assessment. I''ve contributed to projects with NASA and NOAA on coastal
  sediment transport, coral reef ecosystem health, and data gap analyses in marine protected
  areas.'
Teaching Interests: 'Introductory environmental science, oceanography, scientific research &
  communication, environmental policy, and human impact on coastal ecosystems. I emphasize
  place-based learning and regularly integrate case studies from the Monterey Bay region
  into my courses.'
Sustainability Contributions: Courses highlight climate resilience, sustainability
  challenges in coastal regions, and human impacts on marine and watershed ecosystems. I
  mentor student research projects focused on stormwater runoff, agricultural pollution, sea
  level rise, and marine conservation. I'm committed to empowering students to make informed
  decisions for a more sustainable future.
