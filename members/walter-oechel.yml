Name: Walter Oechel
Campus: San Diego
College: College of Sciences
Department: Biology
Title: Distinguished Professor of Biology
Email: woechel@sdsu.edu
Research Interests: 'Developing and understanding the interconnections of the functioning of
  terrestrial, atmospheric, and marine systems on with climate change. Of particular
  interest are: how does climate change affect ecosystem functioning. How does the response
  of ecosystems feed back or feed forward on climate change. How can ecosystems be managed
  to reduce net CO2 emissions.'
Teaching Interests: 'Biology 315, human impacts on the environment, biology 600, ecosystems
  and global change, graduate studies and research on climate change and ecosystems in
  Arctic, Mediterranean, marine, and desert ecosystems.'
Sustainability Contributions: Research with the SDSU Coastal and Marine Institute Director
  of SDSU's Global Change Research Group Past Director of the Joint Doctoral Program in
  Ecology Co-Director of the Center of Climate and Sustainability Studies.
