Name: Lubo Liu
Campus: Fresno State
College: Lyles College of Engineering
Department: Civil Engineering
Title: Professor
Email: llubo@csufresno.edu
Research Interests: 'Water resources and environmental engineering, mainly to improve the
  capability of water retention and nutrients in agricultural soil and to understand
  nearshore processes in the inland water system and the transport of pathogens in the
  environment. Specific research has been in the areas of reactive transport and the fate of
  contaminants in surface water and groundwater, environmental process modeling, groundwater
  bioremediation, subsurface characterization, and soil remediation.'
Teaching Interests: 'Civil engineering, hydraulics, hydrology, urban stormwater management,
  environmental engineering, groundwater engineering, contaminant fate and transport.'
