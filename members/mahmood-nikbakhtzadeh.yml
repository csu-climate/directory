Name: Mahmood Nikbakhtzadeh
Campus: San Bernardino
College: College of Natural Sciences
Department: Health Science And Human Ecology
Title: Assistant Professor & Program Coordinator of Environmental Health Science
Email: mahmood.nikbakhtzadeh@csusb.edu
Research Interests: 'Mosquito behavior and ecology, mosquito-plant interactions, effect of
  agricultural pollutants on non-target organisms, climate change & vector-borne diseases.
  Current research focuses on exploring the impact of agrochemicals on various aspects of
  mosquito behavior, development, survival, physiology and fitness for the transmission of
  pathogens.'
Teaching Interests: 'Environmental health, toxicology, control of vector-borne diseases,
  bioterrorism.'
Sustainability Contributions: Research and publications on climate change and vector-borne
  diseases, agricultural pollution, and mosquito ecology.
