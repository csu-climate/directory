Research Interests: 'How geographic patterns of diversity in estuarine and coastal systems
  are controlled by environmental drivers and biotic interactions. Use of estuaries as a
  laboratory to understand human influences on coastal ecosystems and to test fundamental
  ecological theories about the factors that control species diversity, abundance, and
  ecosystem functioning. Work in the marine invasions lab focuses on the influence of
  freshwater flow and temperature variation on marine invertebrate community assembly,
  biogeography, invasion patterns, and native oyster population dynamics.'
Teaching Interests: ''
Sustainability Contributions: Biodiversity, ecology, estuarine ecology, global change,
