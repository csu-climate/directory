Name: Erin Questad
Campus: Pomona
College: College of Science
Department: Biological Sciences
Title: Professor
Email: ejquestad@cpp.edu
Research Interests: 'Habitat restoration, post-wildfire, remote sensing in habitat
  restoration, rebuilding native plant habitats, invasive plants, conservation of threatened
  and endangered plant species, plant-animal interactions, ecology, sustainable agriculture
  and integrated pest management.'
Teaching Interests: 'Ecology, conservation, biology, plant biology.'
Sustainability Contributions: Works to promote and restore native species to their natural
  habitats. Tests questions related to biodiversity and ecosystem services, landscape
  planning, invasive plant dynamics, and restoration. Current projects focus on how native
  restoration contributes to ecosystem services in agricultural landscapes, using remote
  sensing and biodiversity field surveys.
