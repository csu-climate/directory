Name: Jonathon Stillman
Campus: San Francisco
College: Science and Engineering
Department: Biology
Title: Professor and Chair of Hiring, Retention, Tenure, Promotion
Email: stillmaj@sfsu.edu
Research Interests: 'Environmental physiology of organisms to (1) explore the physiological
  linkages between environmental change (such as climate change) and ecosystem responses
  (such as shifting populations or alteration in species interactions), and (2) to learn
  more about the basic physiological mechanisms that organisms use in responding to their
  environments. Organisms include coastal marine invertebrates, such as porcelain crabs,
  corals, and coccolithophores.'
Teaching Interests: 'Environmental physiology, animal diversity and physiology.'
Sustainability Contributions: Impacts of environmental change on populations.
