Research Interests: 'Dr. Koh''s research is focused on using data analytics to improve the
  learning of computational thinking. He has developed a number of tools and techniques for
  collecting and analyzing data about student learning, and he has used this data to improve
  the design of computational thinking curricula and assessments. His work has the potential
  to make computational thinking more accessible to all students, regardless of their
  background or ability level.'
