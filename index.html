<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSU Climate Faculty Directory</title>
  <!-- Findable, but not cached: noarchive stops search engines serving their own
       copy of the page. Honoured per-page, unlike robots.txt on this URL. -->
  <meta name="robots" content="index, follow, noarchive">
  <meta name="description" content="Find specialists working on climate change and sustainability across the California State University system." />
  <link rel="stylesheet" href="/directory/static/theme.css?v=7" />
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <img src="/directory/static/climate-directory-logo.svg" alt="CSU Climate Directory Logo" class="logo">
      </div>
      <h1>CSU Climate Faculty Directory</h1>
      <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">
        <svg class="theme-icon" id="themeIcon" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span id="themeText">Dark Mode</span>
      </button>
    </div>

    <div class="search-section">
      <input 
        type="text" 
        class="search-bar" 
        placeholder="Search members by name, interests, ..." 
        id="searchInput"
      >

      <div class="filters">
        <div class="filter-group">
          <label for="area">Area of Specialization</label>
          <select class="filter-select" id="area">
            <option value="">All Areas</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="campus">Campus</label>
          <select class="filter-select" id="campus">
            <option value="">All Campuses</option>
          </select>
        </div>
      </div>

      <div class="filter-tags" id="activeFilters"></div>
    </div>

    <p class="contact-note">
      To be added, removed, or have your profile updated, contact
      <button type="button" class="email-btn email-btn--name"
              data-e="dWRlLnlsb3BsYWNAZXNyYWVwZQ==">Erin Pearse</button>.
      Please nominate any missing colleagues for addition.
    </p>

    <div class="results-header">
      <h2>Members</h2>
      <div class="results-count" id="resultsCount">Loading...</div>
    </div>

    <div class="lessons-grid" id="cardsGrid"></div>

    <footer class="footer">
      <div class="footer-brand">
        <img src="/directory/static/iclr-logo.svg" alt="ICLR Logo" class="footer-logo">
        </div>
        <p>The Initiative for Climate Leadership and Resilience at Cal Poly.</p>
      <p>Facilitating collaboration on climate change solutions.</p>
    </footer>
  </div>

<script>
  //style="height: 36px; width: auto; vertical-align: middle; margin-right: 8px;">
  // === Theme management ===
  function setThemeUI(isDark) {
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');
    if (isDark) {
      themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
      themeText.textContent = 'Light Mode';
    } else {
      themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
      themeText.textContent = 'Dark Mode';
    }
  }

  function toggleTheme() {
    const body = document.body;
    const willBeDark = !body.classList.contains('dark-theme');
    body.classList.toggle('dark-theme', willBeDark);
    localStorage.setItem('theme', willBeDark ? 'dark' : 'light');
    setThemeUI(willBeDark);
  }

  function loadTheme() {
    const savedTheme = localStorage.getItem('theme');
    const isDark = savedTheme === 'dark';
    document.body.classList.toggle('dark-theme', isDark);
    setThemeUI(isDark);
  }

  // === Helpers ===
  function $id(id) { return document.getElementById(id); }
  function uniq(values) {
    return [...new Set(values.filter(Boolean).map(v => v.trim()))].sort((a,b)=>a.localeCompare(b));
  }
  function pillize(str) {
    if (!str) return [];
    return str.split(/[,;]+/).map(s => s.trim()).filter(Boolean);
  }

  // Addresses are stored reversed-then-base64'd in members.json, so neither the
  // page nor the data file ever contains anything matching an email pattern.
  function decodeEmail(enc) {
    if (!enc) return '';
    try { return atob(enc).split('').reverse().join(''); } catch (e) { return ''; }
  }

  // Reveal on click: swap the button for the real mailto link.
  function revealEmail(btn) {
    const addr = decodeEmail(btn.dataset.e);
    if (!addr) return;
    const a = document.createElement('a');
    a.className = 'card-email';
    a.href = 'mailto:' + addr;
    a.rel = 'nofollow';
    a.textContent = addr;
    btn.replaceWith(a);
  }

  // === Rendering ===
  function createMemberCard(m) {
    // The address is never written into the page -- only the encoded form, which
    // the button decodes on click. See decodeEmail().
    const emailButton = m['Email_Enc']
      ? `<button type="button" class="email-btn" data-e="${m['Email_Enc']}">Email</button>`
      : '';

    const deptLine = m['Department'] ? `<div class="department-line">${m['Department']}</div>` : '';
    const campusLine = m['Campus'] ? `<div class="campus-line">${m['Campus']}</div>` : '';
  
    // A Notes value that is nothing but URLs is a list of links, not a note.
    function isLinksOnly(v) {
      return !!v && !v.replace(/https?:\/\/\S+/g, '').replace(/[\s;,.]/g, '');
    }

    function escapeHTML(s) {
      return String(s).replace(/[&<>"']/g, c => (
        {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
      ));
    }

    // Turn bare URLs into links, showing the host rather than the raw URL.
    function linkify(value) {
      return escapeHTML(value).replace(/https?:\/\/[^\s;,]+/g, url => {
        let label = url;
        try { label = new URL(url).hostname.replace(/^www\./, ''); } catch (e) {}
        return `<a class="note-link" href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`;
      });
    }

    function block(label, value) {
      if (!value) return '';

      const extraClass = (label === 'Teaching Interests') ? ' teaching-block' : '';
      const links = (label === 'Notes') && isLinksOnly(value);
      const shown = links ? 'Links' : label;
      const body = /https?:\/\//.test(value) ? linkify(value) : value;

      return `
        <div class="meta-item${extraClass}">
          <span class="meta-label">${shown}:</span>
          <span class="meta-value">${body}</span>
        </div>
      `;
    }
  
    const card = document.createElement('div');
    card.className = 'lesson-card';
    card.innerHTML = `
      <div class="card-identity">
        <div class="title-row">
          <div class="lesson-title">${m['Name'] || '(No name)'}</div>
          ${emailButton}
        </div>
        ${deptLine}
        ${campusLine}
      </div>

      <div class="lesson-meta">
        ${block('Research Interests', m['Research Interests'])}
        ${block('Teaching Interests', m['Teaching Interests'])}
        ${block('Sustainability Contributions', m['Sustainability Contributions'])}
        ${block('Notes', m['Notes'])}
      </div>
    `;
    return card;
  }

  function applyFilters() {
    const q = ($id('searchInput')?.value || '').toLowerCase();
    const area = $id('area') ? $id('area').value : '';
    const campus = $id('campus') ? $id('campus').value : '';

    const filtered = MEMBERS.filter(m => {
      const blob = [
        m['Name'], m['Research Interests'], m['Teaching Interests'],
        m['Notes'], m['Sustainability Contributions'],
        m['Department'], m['Areas'].join(' '), m['Campus']
      ].join(' ').toLowerCase();
      if (q && !blob.includes(q)) return false;
      if (area && !m['Areas'].includes(area)) return false;
      if (campus && m['Campus'] !== campus) return false;
      return true;
    });

    const grid = $id('cardsGrid');
    grid.innerHTML = '';
    filtered.forEach(m => grid.appendChild(createMemberCard(m)));
    $id('resultsCount').textContent = `${filtered.length} of ${MEMBERS.length}`;

    const tagsEl = $id('activeFilters');
    tagsEl.innerHTML = '';
    const active = [];
    if ($id('area') && area) active.push({label:'Area of Specialization', value:area, id:'area'});
    if ($id('campus') && campus)       active.push({label:'Campus', value:campus, id:'campus'});
    active.forEach(f => {
      const t = document.createElement('span');
      t.className = 'filter-tag';
      t.innerHTML = `<strong>${f.label}:</strong> ${f.value} <button class="remove" aria-label="Clear ${f.label}">&times;</button>`;
      t.querySelector('button').addEventListener('click', () => {
        $id(f.id).value = '';
        applyFilters();
      });
      tagsEl.appendChild(t);
    });
  }

  // === App entry ===
  let MEMBERS = [];

  async function init() {
    loadTheme();

    const url = '/directory/members.json?v=' + Date.now();
    console.log('Fetching members from:', url);

    let resp;
    try {
      resp = await fetch(url, { cache: 'no-store', headers: { 'Accept': 'application/json' } });
      if (!resp.ok) throw new Error(`HTTP ${resp.status} ${resp.statusText}`);
    } catch (e) {
      console.error('Failed to fetch members.json:', e);
      $id('resultsCount').textContent = 'Failed to load data';
      return;
    }

    let data;
    try {
      data = await resp.json();
    } catch (e) {
      console.error('members.json is not valid JSON:', e);
      $id('resultsCount').textContent = 'Bad data';
      return;
    }

    const normalize = (m) => ({
      ...m,
      Name: m.Name ?? m.name ?? '',
      // Deliberately not decoded here. Addresses are decoded one at a time,
      // only when a reader clicks that member's Email button, so a scraper that
      // runs the page's JavaScript still has no list of addresses to lift.
      // The cost is that search cannot match on an email address.
      Campus: m.Campus ?? m.campus ?? '',
      Department: m.Department ?? m.department ?? '',
      Areas: m.Areas ?? m.Areas_List ?? m['Area of Specialization'] ?? [],
      'Research Interests': m['Research Interests'] ?? m.Research_Interests ?? '',
      'Teaching Interests': m['Teaching Interests'] ?? m.Teaching_Interests ?? '',
      'Sustainability Contributions': m['Sustainability Contributions'] ?? m.Sustainability_Contributions ?? '',
      Notes: m.Notes ?? ''
    });

    MEMBERS = data.map(normalize);

    const areas    = uniq(MEMBERS.flatMap(m => m['Areas']));
    const campuses = uniq(MEMBERS.map(m => m['Campus']));

    function fill(id, values) {
      const sel = $id(id);
      if (!sel) return;
      const first = sel.querySelector('option:first-child');
      sel.innerHTML = ''; if (first) sel.appendChild(first);
      values.forEach(v => { const o=document.createElement('option'); o.value=v; o.textContent=v; sel.appendChild(o); });
      sel.addEventListener('change', applyFilters);
    }

    if ($id('area'))   fill('area', areas);
    if ($id('campus')) fill('campus', campuses);

    const searchEl = $id('searchInput');
    if (searchEl) searchEl.addEventListener('input', applyFilters);

    // One delegated handler on the body: survives re-rendering the grid, and
    // also covers the contact button, which lives outside it.
    document.body.addEventListener('click', (e) => {
      const btn = e.target.closest('.email-btn');
      if (btn) revealEmail(btn);
    });

    applyFilters();
  }

  init();
</script>
</body>
</html>
